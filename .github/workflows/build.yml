name: Build

# Builds the Switch port in devkitPro's official devkitA64 container, for
# every push to main, every pull request and by hand, and keeps the card's
# folder (tools/switch_package.py: the program, the game's image, the menu
# files and the broker list) as the run's artifact. No secrets are used, and
# no game files: the maps come from the player's own disc.
#
# Two toolchains, and neither can be replaced by the other: devkitA64 builds
# the host, and the Android NDK builds the guest, which is ILP32 AArch64
# (32-bit pointers, because the Xbox data formats embed them) and so cannot
# be built by devkitA64 at all. The image carries devkitA64 and the libraries
# the host links against (devkitPro's package hosts answer 403 to a GitHub
# runner, so nothing can be installed from them here); the NDK comes from
# Google, and the guest's clang from LLVM's own packages, as Debian's emits
# indirect branches the ELF assembler will not take for arm64_32. The release
# workflow (release.yml) builds the same way for a tag.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  switch:
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    timeout-minutes: 90
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
    steps:
      # Prove the image has what the host links against, and say which is
      # missing if it does not. Better a clear message now than a link error
      # later that reads like a build problem.
      - name: Check the toolchain
        run: |
          echo "--- /opt/devkitpro ---"
          ls /opt/devkitpro
          for library in libSDL2 libGLESv2 libEGL; do
            if [ -f "/opt/devkitpro/portlibs/switch/lib/$library.a" ]; then
              echo "found $library"
            else
              echo "::error::$library is not in the image; the host will not link without it"
            fi
          done
          if [ -f /opt/devkitpro/libnx/lib/libdeko3d.a ]; then
            echo "found libdeko3d"
          else
            echo "::error::libdeko3d is not in the image; the host will not link without it"
          fi

      # The guest needs the NDK, which the image does not carry and the
      # runner's own SDK is not visible from inside a container. Android
      # publishes the whole NDK as one archive, so it is fetched and pointed
      # at with ANDROID_NDK_HOME, which is what configure.py reads. Its bin
      # directory is not put on PATH: the build calls the NDK's tools by
      # path, and the host's clang is the one below.
      - name: Install the Android NDK
        run: |
          curl -fsSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q ndk.zip -d /opt
          rm ndk.zip
          echo "ANDROID_NDK_HOME=/opt/android-ndk-r26d" >> "$GITHUB_ENV"

      - name: Install the build tools
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key |
            gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/bookworm/ llvm-toolchain-bookworm-22 main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update
          # (meson, bison, flex, mako and git: UAM, deko3d's shader compiler,
          # fetched and built into the program for the deko3d renderer;
          # without them the build leaves it out, and the program can compile
          # no shader on the console)
          apt-get install -y --no-install-recommends python3 ninja-build ccache clang-22 unzip curl gnupg \
            meson bison flex python3-mako git
          clang-22 --version | head -1
          ln -sf /usr/bin/clang-22 /usr/local/bin/clang

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ccache-switch-build-${{ github.sha }}
          restore-keys: ccache-switch-build-

      - name: Configure
        run: python3 chupathingyce/configure.py --console-port port/switch --compiler-launcher ccache

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 2G
        run: |
          ninja switch
          ccache --show-stats

      # the card's folder, as a player installs it (without maps)
      - name: Package
        run: |
          python3 tools/switch_package.py --out package
          ls -lR package/switch/ChupaThingyCE

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: warthog-switch-${{ github.sha }}
          path: package/switch/ChupaThingyCE
          if-no-files-found: error
          retention-days: 7
